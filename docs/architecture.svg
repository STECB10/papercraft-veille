<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 670" width="1110" height="670" role="img"><title>Architecture : un relais Cloudflare lance chaque matin le workflow Vidéo du jour, qui interroge Europe PMC, Claude Code et ElevenLabs, range la vidéo dans une release GitHub et l'envoie sur Telegram ; un second workflow lit le clic Publier et publie sur LinkedIn.</title><style>
svg{color:#1d2421;font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
text{font-size:13px;fill:#1d2421}
.t-small{font-size:11.5px;fill:#5d6762}.t-mono{font-family:Menlo,'IBM Plex Mono',monospace;font-size:11.5px}.t-bold{font-weight:600}
.box{fill:#fff;stroke:#1d2421;stroke-width:1.2}.box-ai{fill:#e2efec;stroke:#0d6b5f;stroke-width:1.5}
.box-hu{fill:#f7ead9;stroke:#b25f00;stroke-width:1.5}.box-off{fill:none;stroke:#5d6762;stroke-width:1.2;stroke-dasharray:5 4}
.zone{fill:none;stroke:#c9cfcb;stroke-width:1.5;stroke-dasharray:6 5}
.edge{fill:none;stroke:#1d2421;stroke-width:1.3}.edge-ai{fill:none;stroke:#0d6b5f;stroke-width:1.6}
.edge-hu{fill:none;stroke:#b25f00;stroke-width:1.6}.edge-off{fill:none;stroke:#5d6762;stroke-width:1.3;stroke-dasharray:5 4}
.life{stroke:#c9cfcb;stroke-width:1.2;stroke-dasharray:3 4}
.ai-text{fill:#0d6b5f}.hu-text{fill:#b25f00}
.head{fill:#1d2421}.head-ai{fill:#0d6b5f}.head-hu{fill:#b25f00}.head-off{fill:#5d6762}
</style><rect x="0" y="0" width="1110" height="670" fill="#ffffff"/>
          <defs>
            <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
            <marker id="a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-ai"/></marker>
            <marker id="a-hu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-hu"/></marker>
            <marker id="a-off" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head-off"/></marker>
          </defs>

          <!-- Déclencheurs -->
          <text x="20" y="84" class="t-small">DÉCLENCHEURS</text>
          <rect x="20" y="96" width="210" height="72" rx="4" class="box"/>
          <text x="32" y="120" class="t-bold">Relais Cloudflare</text>
          <text x="32" y="139" class="t-small">tourne chaque minute, gratuit</text>
          <text x="32" y="156" class="t-small">6 h 15, relance à 7 h 30</text>
          <rect x="20" y="190" width="210" height="56" rx="4" class="box-off"/>
          <text x="32" y="214" class="t-bold">Horaires GitHub</text>
          <text x="32" y="233" class="t-small">secours : 6 h 17 · 6 h 47 · 7 h 23</text>
          <line x1="232" y1="118" x2="308" y2="114" class="edge" marker-end="url(#a)"/>
          <text x="240" y="108" class="t-small">lance</text>
          <line x1="232" y1="214" x2="308" y2="128" class="edge-off" marker-end="url(#a-off)"/>

          <!-- Workflow Vidéo du jour -->
          <rect x="290" y="56" width="270" height="596" rx="8" class="zone"/>
          <text x="306" y="78" class="t-small">« VIDÉO DU JOUR » · GITHUB ACTIONS</text>
          <rect x="310" y="92" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="111" class="t-bold">Garde</text><text x="322" y="127" class="t-small">vidéo du jour déjà faite ? alors arrêt</text>
          <rect x="310" y="154" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="173" class="t-bold">Veille</text><text x="322" y="189" class="t-small">notation, 6 études candidates</text>
          <rect x="310" y="216" width="230" height="44" rx="4" class="box-ai"/>
          <text x="322" y="235" class="t-bold">Étude, script, post</text><text x="322" y="251" class="t-small">Claude choisit et écrit</text>
          <rect x="310" y="278" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="297" class="t-bold">Vérification indépendante</text><text x="322" y="313" class="t-small">chaque chiffre contre la source</text>
          <rect x="310" y="340" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="359" class="t-bold">Fabrication</text><text x="322" y="375" class="t-small">voix, animation, musique, rendu</text>
          <rect x="310" y="402" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="421" class="t-bold">Contrôles vidéo</text><text x="322" y="437" class="t-small">durée, noir, image figée, −16 LUFS</text>
          <rect x="310" y="464" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="483" class="t-bold">Rangement</text><text x="322" y="499" class="t-small">release GitHub « jour-date »</text>
          <rect x="310" y="526" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="545" class="t-bold">Envoi</text><text x="322" y="561" class="t-small">vidéo + post sur Telegram</text>
          <rect x="310" y="588" width="230" height="44" rx="4" class="box"/>
          <text x="322" y="607" class="t-bold">Trace</text><text x="322" y="623" class="t-small">commit « Jour date », historique</text>
          <line x1="425" y1="136" x2="425" y2="152" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="198" x2="425" y2="214" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="260" x2="425" y2="276" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="322" x2="425" y2="338" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="384" x2="425" y2="400" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="446" x2="425" y2="462" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="508" x2="425" y2="524" class="edge" marker-end="url(#a)"/>
          <line x1="425" y1="570" x2="425" y2="586" class="edge" marker-end="url(#a)"/>
          <path d="M310 300 C278 300, 278 238, 308 238" class="edge-ai" marker-end="url(#a-ai)"/>
          <text x="248" y="274" text-anchor="end" class="t-small ai-text">REFUSÉ :</text>
          <text x="248" y="290" text-anchor="end" class="t-small ai-text">Claude corrige</text>

          <!-- Services externes -->
          <rect x="640" y="150" width="250" height="52" rx="4" class="box"/>
          <text x="652" y="172" class="t-bold">Europe PMC</text><text x="652" y="190" class="t-small">recherche et texte intégral libre</text>
          <line x1="542" y1="176" x2="638" y2="176" class="edge" marker-end="url(#a)"/>
          <text x="550" y="168" class="t-small">21 jours</text>
          <rect x="640" y="212" width="250" height="52" rx="4" class="box-ai"/>
          <text x="652" y="234" class="t-bold">Claude Code</text><text x="652" y="252" class="t-small">skill /etude-du-jour, 90 tours au plus</text>
          <line x1="542" y1="238" x2="638" y2="238" class="edge-ai" marker-end="url(#a-ai)"/>
          <text x="550" y="230" class="t-small ai-text">abonnement</text>
          <rect x="640" y="336" width="250" height="52" rx="4" class="box"/>
          <text x="652" y="358" class="t-bold">ElevenLabs</text><text x="652" y="376" class="t-small">voix Léo, 2 prises · Scribe</text>
          <line x1="542" y1="362" x2="638" y2="362" class="edge" marker-end="url(#a)"/>
          <path d="M640 466 a62 9 0 0 1 124 0 v34 a62 9 0 0 1 -124 0 z" class="box"/>
          <path d="M640 466 a62 9 0 0 0 124 0" class="edge"/>
          <text x="702" y="490" text-anchor="middle" class="t-bold">Releases</text>
          <text x="702" y="504" text-anchor="middle" class="t-small">vidéo + post</text>
          <line x1="542" y1="486" x2="638" y2="486" class="edge" marker-end="url(#a)"/>
          <rect x="640" y="522" width="250" height="60" rx="4" class="box-hu"/>
          <text x="652" y="545" class="t-bold">Validation sur Telegram</text><text x="652" y="565" class="t-small">✅ Publier · ❌ Rejeter</text>
          <line x1="542" y1="548" x2="638" y2="548" class="edge" marker-end="url(#a)"/>

          <!-- Workflow Écoute -->
          <rect x="916" y="392" width="184" height="196" rx="8" class="zone"/>
          <text x="928" y="412" class="t-small">« ÉCOUTE TELEGRAM »</text>
          <rect x="930" y="424" width="156" height="50" rx="4" class="box"/>
          <text x="942" y="445" class="t-bold">Lecture des clics</text><text x="942" y="462" class="t-small">toutes les 30 min</text>
          <rect x="930" y="512" width="156" height="50" rx="4" class="box"/>
          <text x="942" y="533" class="t-bold">Publication</text><text x="942" y="550" class="t-small">via Upload-Post</text>
          <line x1="1008" y1="474" x2="1008" y2="510" class="edge" marker-end="url(#a)"/>
          <line x1="892" y1="548" x2="928" y2="458" class="edge-hu" marker-end="url(#a-hu)"/>
          <text x="900" y="436" text-anchor="end" class="t-small hu-text">clic ✅</text>
          <line x1="766" y1="488" x2="928" y2="532" class="edge" marker-end="url(#a)"/>
          <text x="790" y="484" class="t-small">télécharge</text>
          <rect x="930" y="612" width="156" height="44" rx="4" class="box"/>
          <text x="942" y="631" class="t-bold">LinkedIn</text><text x="942" y="647" class="t-small">page Papercraft.AI</text>
          <line x1="1008" y1="562" x2="1008" y2="610" class="edge" marker-end="url(#a)"/>
          <polyline points="125,94 125,30 1060,30 1060,422" class="edge" marker-end="url(#a)"/>
          <text x="600" y="24" class="t-small">le relais lance aussi l'écoute dès le clic, sans attendre 30 min</text>
        </svg>