<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" role="img"><title>Une journée : le relais lance le workflow, qui interroge Europe PMC, confie l'étude à Claude, fait la voix, fabrique la vidéo et l'envoie sur Telegram ; le clic Publier relance l'écoute, qui publie sur LinkedIn.</title><style>
