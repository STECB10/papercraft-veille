name: Écoute Telegram (Publier / Rejeter)
on:
  schedule:
    - cron: "*/30 5-21 * * *"   # toutes les 30 min, de 6 h à 23 h environ (heure de Paris)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecoute-telegram
  cancel-in-progress: false
jobs:
  ecouter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 pipeline/publication.py ecouter
      - name: Garder la trace
        run: |
          git config user.name "papercraft-bot" && git config user.email "papercraft-bot@users.noreply.github.com"
          git add pipeline/historique.json && git commit -qm "Publication : mise à jour" && git push -q || true
